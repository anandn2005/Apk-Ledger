name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | head -n 1 | cut -d'"' -f2 | cut -d'.' -f1)
          echo "Active Java Major Version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Active Java major version ($JAVA_VER) is lower than 17."
            exit 1
          fi

      - name: Accept Android SDK licenses and prepare environment
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_DIR" ] && [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
          if [ ! -f "./.env" ]; then
            if [ -f "./.env.example" ]; then
              cp "./.env.example" "./.env"
            else
              touch "./.env"
            fi
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Prepare debug keystore
        run: |
          if [ ! -s "./debug.keystore" ] && [ -f "./debug.keystore.base64" ]; then
            echo "Decoding ./debug.keystore from ./debug.keystore.base64..."
            base64 --decode "./debug.keystore.base64" > "./debug.keystore" || true
          fi

          if [ ! -s "./debug.keystore" ]; then
            rm -f "./debug.keystore"
            echo "Generating temporary debug keystore..."
            keytool -genkeypair -v -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -s "./debug.keystore" ]; then
            echo "Error: ./debug.keystore does not exist and could not be created."
            exit 1
          fi
          echo "Confirmed ./debug.keystore exists."

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK Output
        run: |
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Verified app/build/outputs/apk/debug/app-debug.apk exists."
          else
            echo "APK missing at expected location. Searching inside app/build/outputs/apk..."
            find app/build/outputs/apk -type f -name "*.apk" || true
            echo "Error: app/build/outputs/apk/debug/app-debug.apk was not found."
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
